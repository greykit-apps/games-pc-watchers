<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The share card: rendered to og.png by tools/render-icons.sh. Laid out
       as the other Tactical games' cards are (games-meta STANDARD.md §9): a
       cyan rule, the wordmark with the game's half in cyan, the description,
       a tagline, the icon. Behind the words, the game itself: og-scene.png
       is a frame of Market Plaza at night from the game's own renderer (pixel
       size 2), the squad on the pavement by the fountain. The words sit on a
       shade that clears before it reaches them. -->
  <rect width="1200" height="630" fill="#05070f"/>
  <image x="0" y="0" width="1200" height="630" xlink:href="og-scene.png" href="og-scene.png" style="image-rendering:pixelated"/>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070f" stop-opacity=".94"/>
      <stop offset=".45" stop-color="#05070f" stop-opacity=".86"/>
      <stop offset=".62" stop-color="#05070f" stop-opacity=".3"/>
      <stop offset=".74" stop-color="#05070f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f" stop-opacity=".75"/>
      <stop offset="1" stop-color="#05070f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070f" stop-opacity=".8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#shade)"/>
  <rect width="1200" height="190" fill="url(#head)"/>
  <rect y="500" width="1200" height="130" fill="url(#foot)"/>
  <rect width="1200" height="8" fill="#54f2ff"/>
  <text x="105" y="140" font-family="Menlo, ui-monospace, monospace" font-size="64" font-weight="700" fill="#e9e9f2">PumaCity: <tspan fill="#54f2ff">Watchers</tspan></text>
  <svg x="1020" y="56" width="100" height="100" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="10" fill="#05070f"/>
    <path d="M14 54 L20 30 L32 36 L44 30 L50 54 Z" fill="#1b2130"/>
    <path d="M20 30 L26 46 L32 36 Z M44 30 L38 46 L32 36 Z" fill="#2c3550"/>
    <ellipse cx="32" cy="26" rx="13" ry="12" fill="#b08a5a"/>
    <path d="M20 22 L21 6 L29 16 Z M44 22 L43 6 L35 16 Z" fill="#b08a5a"/>
    <rect x="19" y="21" width="26" height="6" fill="#0a0c14"/>
    <rect x="20" y="22.5" width="24" height="2.5" fill="#54f2ff"/>
  </svg>
  <text y="236" font-family="Menlo, ui-monospace, monospace" font-size="34" fill="#b4bccb">
    <tspan x="105" dy="0">An alternate-universe</tspan>
    <tspan x="105" dy="50">Casey Benton runs a</tspan>
    <tspan x="105" dy="50">dawn-of-cyberpunk sprawl</tspan>
    <tspan x="105" dy="50">with an iron paw.</tspan>
  </text>
  <text x="105" y="580" font-family="Menlo, ui-monospace, monospace" font-size="26" fill="#54f2ff">Squad tactics, after Bullfrog's Syndicate (1993)</text>
</svg>
